<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>justdream</title>
  <style>
    :root {
      --bg: #0e1114; --panel: #151a1f; --ink: #e8eef2; --muted: #8a9aa6;
      --line: #273039; --accent: #6bb3c8; --accent-ink: #061018;
      --user: #1c252c; --bot: #182026;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% -10%, #1a2830 0%, transparent 55%),
        radial-gradient(700px 400px at 100% 0%, #1a2030 0%, transparent 50%),
        var(--bg);
      display: flex; flex-direction: column;
    }
    header { max-width: 1100px; width: 100%; margin: 0 auto; padding: 1rem 1.25rem 0.5rem; }
    header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.03em; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .layout {
      flex: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1rem;
      max-width: 1100px; width: 100%; margin: 0 auto; padding: 0.5rem 1.25rem 1rem; min-height: 0;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .panel {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--line); border-radius: 14px; min-height: 0;
      display: flex; flex-direction: column;
    }
    .progress-wrap { padding: 0.75rem 1rem 0; }
    .progress-label { display: flex; justify-content: space-between; gap: 0.75rem; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.35rem; }
    .progress-label #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pct { font-variant-numeric: tabular-nums; color: var(--ink); }
    .bar { height: 8px; border-radius: 999px; background: #0a0d10; border: 1px solid var(--line); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3a6a7a, var(--accent)); transition: width 0.35s ease; }
    .chat { overflow: auto; padding: 1rem; gap: 0.75rem; display: flex; flex-direction: column; flex: 1; }
    .bubble { max-width: 94%; padding: 0.75rem 0.9rem; border-radius: 12px; border: 1px solid var(--line); line-height: 1.4; white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: var(--user); }
    .bubble.assistant { align-self: flex-start; background: var(--bot); }
    .bubble .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.35rem; }
    .bubble.err { color: #f0c2c2; }
    .composer { border-top: 1px solid var(--line); padding: 0.85rem; display: grid; gap: 0.55rem; }
    textarea, input[type="text"] {
      width: 100%; border: 1px solid var(--line); background: #0a0d10; color: var(--ink);
      border-radius: 10px; padding: 0.7rem 0.85rem; font: inherit;
    }
    textarea#script { min-height: 8rem; resize: vertical; line-height: 1.45; }
    textarea#styleLock { min-height: 3.2rem; resize: vertical; font-size: 0.88rem; color: var(--muted); }
    .presets, .speeds { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .speeds { margin-bottom: 0.35rem; }
    button.speed, button.preset {
      border: 1px solid var(--line); background: #0c0b09; color: var(--muted);
      border-radius: 999px; padding: 0.4rem 0.75rem; font: inherit; cursor: pointer;
    }
    button.speed.active, button.preset.active {
      border-color: var(--accent); color: var(--ink); background: #1a1510;
    }
    .preset {
      border: 1px solid var(--line); background: #0a0d10; color: var(--muted);
      border-radius: 999px; padding: 0.4rem 0.75rem; font: inherit; font-size: 0.8rem; cursor: pointer;
    }
    .preset.active { border-color: var(--accent); color: var(--ink); background: #132028; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    button {
      border: 0; border-radius: 999px; padding: 0.65rem 1.15rem;
      font: inherit; font-weight: 650; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .viewer-panel { padding: 1rem; gap: 0.75rem; }
    .viewer-panel label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    video {
      width: 100%; max-height: 380px; border-radius: 12px; background: #080a0c;
      border: 1px solid var(--line); display: none;
    }
    video.show { display: block; }
    .hint { color: var(--muted); font-size: 0.82rem; }
    #refList { color: var(--muted); font-size: 0.8rem; }
    .clips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.35rem; }
    .clips button {
      border-radius: 8px; padding: 0.35rem 0.65rem; font-size: 0.78rem; font-weight: 600;
      background: #0a0d10; color: var(--muted); border: 1px solid var(--line);
    }
    .clips button.active { border-color: var(--accent); color: var(--ink); background: #132028; }
    .clips button.final { border-color: var(--accent); color: var(--accent); }
    .estimate {
      border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 0.9rem;
      background: #0c1216; display: grid; gap: 0.35rem;
    }
    .estimate .title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .estimate .big { font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .estimate .sub { font-size: 0.82rem; color: var(--accent); }
    .estimate .meta { font-size: 0.78rem; color: var(--muted); }
    .estimate.empty .big { color: var(--muted); font-size: 0.9rem; font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <h1>justdream</h1>
    <p id="device">Checking GPU…</p>
  </header>
  <div class="layout">
    <section class="panel">
      <div class="progress-wrap">
        <div class="progress-label">
          <span id="status">idle</span>
          <span id="pct"></span>
          <span id="queue"></span>
        </div>
        <div class="bar" id="bar"><span id="barFill"></span></div>
      </div>
      <div class="chat" id="chat"></div>
      <form class="composer" id="form">
        <div class="speeds" id="speeds"></div>
        <div class="presets" id="presets"></div>
        <textarea id="script" name="script" placeholder="Script — one sentence/paragraph per beat.
Each beat becomes ONE clip, chained from the previous last frame (same style, same character)."></textarea>
        <textarea id="styleLock" name="style_lock"></textarea>
        <div class="row">
          <input type="file" id="refs" accept="image/*,video/*" multiple />
          <button type="button" class="secondary" id="uploadRefs">Attach refs</button>
        </div>
        <div id="refList">No reference images/videos attached.</div>
        <input type="hidden" name="speed" id="speed" value="fast" />
        <input type="hidden" name="preset" id="preset" value="fast" />
        <div class="estimate empty" id="estimate">
          <div class="title">Estimate</div>
          <div class="big" id="estBig">Type a script to see video length &amp; gen ETA</div>
          <div class="sub" id="estSub"></div>
          <div class="meta" id="estMeta"></div>
        </div>
        <div class="row">
          <span class="hint">Fast = fewer frames (biggest speed win). Keep PC awake.</span>
          <button type="button" class="secondary" id="preview">Refresh estimate</button>
          <button id="go" type="submit">Dream</button>
        </div>
      </form>
    </section>
    <section class="panel viewer-panel">
      <label id="viewerLabel">Latest clip</label>
      <video id="player" controls playsinline></video>
      <div id="clipList" class="clips"></div>
      <div id="links" class="hint"></div>
    </section>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const go = document.getElementById("go");
    const previewBtn = document.getElementById("preview");
    const scriptEl = document.getElementById("script");
    const styleEl = document.getElementById("styleLock");
    const presetEl = document.getElementById("preset");
    const speedEl = document.getElementById("speed");
    const presetsEl = document.getElementById("presets");
    const speedsEl = document.getElementById("speeds");
    const refsInput = document.getElementById("refs");
    const uploadBtn = document.getElementById("uploadRefs");
    const refList = document.getElementById("refList");
    const estimateEl = document.getElementById("estimate");
    const estBig = document.getElementById("estBig");
    const estSub = document.getElementById("estSub");
    const estMeta = document.getElementById("estMeta");
    const statusEl = document.getElementById("status");
    const pctEl = document.getElementById("pct");
    const queueEl = document.getElementById("queue");
    const bar = document.getElementById("bar");
    const barFill = document.getElementById("barFill");
    const player = document.getElementById("player");
    const links = document.getElementById("links");
    const clipList = document.getElementById("clipList");
    const viewerLabel = document.getElementById("viewerLabel");
    const device = document.getElementById("device");
    let seenIds = new Set();
    let lastVideo = null;
    let statusAbort = null;
    let lastPct = 0;
    let presets = [];
    let speeds = [];
    let refPaths = [];
    let estimateTimer = null;
    let knownClips = [];

    function playOutput(file, label) {
      if (!file) return;
      lastVideo = file;
      player.src = "/outputs/" + file + "?t=" + Date.now();
      player.classList.add("show");
      viewerLabel.textContent = label || "Latest clip";
      links.innerHTML = '<a href="/outputs/' + file + '" download>Download ' + (label || "MP4") + '</a>';
      [...clipList.querySelectorAll("button")].forEach((b) => {
        b.classList.toggle("active", b.dataset.file === file);
      });
      player.play().catch(() => {});
    }

    function renderClips(clips, currentFile, isFinal) {
      knownClips = clips || knownClips;
      clipList.innerHTML = "";
      (knownClips || []).forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = c.label || ("Clip " + ((c.i || 0) + 1));
        b.dataset.file = c.file;
        if (c.final) b.classList.add("final");
        if (c.file === currentFile) b.classList.add("active");
        b.addEventListener("click", () => playOutput(c.file, c.label));
        clipList.appendChild(b);
      });
      if (isFinal && currentFile) viewerLabel.textContent = "Final film";
    }

    function showEstimateEmpty(msg) {
      estimateEl.classList.add("empty");
      estBig.textContent = msg || "Type a script to see video length & gen ETA";
      estSub.textContent = "";
      estMeta.textContent = "";
    }

    function showEstimate(data) {
      estimateEl.classList.remove("empty");
      estBig.textContent = data.beats + " clips · video " + data.video_label;
      estSub.textContent = "Gen ETA ~" + data.gen_eta_mid + "  (range " + data.gen_eta_lo + " – " + data.gen_eta_hi + ")";
      estMeta.textContent = data.preset_label + " · " + data.clip + " · ~" + data.gen_per_clip + "/clip · " + data.mode;
    }

    async function refreshEstimate() {
      const script = (scriptEl.value || "").trim();
      if (!script) {
        showEstimateEmpty();
        return;
      }
      const fd = new FormData();
      fd.set("script", script);
      fd.set("speed", speedEl.value || "fast");
      fd.set("preset", presetEl.value || "fast");
      fd.set("style_lock", styleEl.value || "");
      try {
        const res = await fetch("/api/preview", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.ok) {
          showEstimateEmpty(data.error || "Could not estimate");
          return;
        }
        showEstimate(data);
      } catch (e) {
        showEstimateEmpty("Estimate failed");
      }
    }

    function scheduleEstimate() {
      clearTimeout(estimateTimer);
      estimateTimer = setTimeout(refreshEstimate, 350);
    }

    function addBubble(msg) {
      if (seenIds.has(msg.id)) return;
      seenIds.add(msg.id);
      const div = document.createElement("div");
      div.className = "bubble " + (msg.role || "assistant") + (msg.error ? " err" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = msg.role === "user" ? "You" : "justdream";
      div.appendChild(meta);
      const body = document.createElement("div");
      body.textContent = msg.text || "";
      div.appendChild(body);
      if (msg.video) {
        const a = document.createElement("div");
        a.innerHTML = '<a href="/outputs/' + msg.video + '" download>Download MP4</a>';
        div.appendChild(a);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderSpeeds(list) {
      speeds = list || [];
      speedsEl.innerHTML = "";
      speeds.forEach((s) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "speed" + (s.id === speedEl.value ? " active" : "");
        b.textContent = s.label;
        b.title = s.blurb || "";
        b.addEventListener("click", () => {
          speedEl.value = s.id;
          presetEl.value = s.preset;
          [...speedsEl.children].forEach((c) => c.classList.remove("active"));
          b.classList.add("active");
          [...presetsEl.children].forEach((c) => {
            c.classList.toggle("active", c.dataset.id === s.preset);
          });
          scheduleEstimate();
        });
        speedsEl.appendChild(b);
      });
    }

    function renderPresets(list) {
      presets = list || [];
      presetsEl.innerHTML = "";
      presets.forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.id = p.id;
        b.className = "preset" + (p.id === presetEl.value ? " active" : "");
        b.textContent = p.label;
        b.title = p.blurb || "";
        b.addEventListener("click", () => {
          presetEl.value = p.id;
          speedEl.value = "custom";
          [...presetsEl.children].forEach((c) => c.classList.remove("active"));
          b.classList.add("active");
          [...speedsEl.children].forEach((c) => c.classList.remove("active"));
          scheduleEstimate();
        });
        presetsEl.appendChild(b);
      });
    }

    function setProgress(data) {
      statusEl.textContent = data.status || "idle";
      queueEl.textContent = data.queue_len ? (data.queue_len + " queued") : "";
      const p = data.progress;
      if (!data.busy) {
        lastPct = 0;
        bar.classList.remove("indeterminate");
        barFill.style.width = (p === 1 ? "100%" : "0%");
        pctEl.textContent = "";
        go.textContent = "Dream";
        if (data.last_took) {
          estimateEl.classList.remove("empty");
          estMeta.textContent = "Last run took " + data.last_took;
        }
        return;
      }
      go.textContent = "Queue another";
      if (p === null || p === undefined) {
        bar.classList.add("indeterminate");
        barFill.style.width = "35%";
        pctEl.textContent = "";
      } else {
        const pct = Math.max(lastPct, Math.max(0, Math.min(100, p * 100)));
        lastPct = pct;
        bar.classList.remove("indeterminate");
        barFill.style.width = pct + "%";
        pctEl.textContent = Math.round(pct) + "%";
      }
    }

    async function refresh() {
      if (statusAbort) statusAbort.abort();
      statusAbort = new AbortController();
      try {
        const res = await fetch("/api/status", { signal: statusAbort.signal, cache: "no-store" });
        const data = await res.json();
        if ((data.speeds || data.presets) && !speedsEl.children.length) {
          if (data.defaults) {
            if (data.defaults.speed) speedEl.value = data.defaults.speed;
            if (data.defaults.preset) presetEl.value = data.defaults.preset;
            if (data.defaults.style_lock && !styleEl.value) styleEl.value = data.defaults.style_lock;
          }
          renderSpeeds(data.speeds || []);
          renderPresets(data.presets || []);
        }
        if (data.device) {
          device.textContent = "GPU: " + data.device +
            (data.vram_gb != null ? " · " + data.vram_gb + "GB" : "") +
            (data.device_mode ? " · " + data.device_mode : "") +
            (data.busy ? " · dreaming" : " · continuity ready");
        }
        setProgress(data);
        (data.messages || []).forEach(addBubble);
        if (data.clips && data.clips.length) {
          renderClips(data.clips, data.video, data.is_final);
        }
        if (data.video && data.video !== lastVideo) {
          playOutput(data.video, data.is_final ? "Final film" : "Latest clip");
          if (data.clips && data.clips.length) renderClips(data.clips, data.video, data.is_final);
        }
      } catch (e) {
        if (e.name !== "AbortError") statusEl.textContent = "status poll failed";
      }
    }

    uploadBtn.addEventListener("click", async () => {
      if (!refsInput.files || !refsInput.files.length) {
        refList.textContent = "Choose image/video files first.";
        return;
      }
      const fd = new FormData();
      [...refsInput.files].forEach((f) => fd.append("files", f));
      const res = await fetch("/api/upload", { method: "POST", body: fd });
      const data = await res.json();
      if (!data.ok) { refList.textContent = "upload failed"; return; }
      refPaths = data.paths || [];
      refList.textContent = "Attached " + refPaths.length + " ref(s) — used as opening keyframe / chain memory.";
    });

    previewBtn.addEventListener("click", () => refreshEstimate());
    scriptEl.addEventListener("input", scheduleEstimate);
    styleEl.addEventListener("input", scheduleEstimate);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const script = (scriptEl.value || "").trim();
      if (!script) return;
      const fd = new FormData();
      fd.set("script", script);
      fd.set("speed", speedEl.value || "fast");
      fd.set("preset", presetEl.value || "fast");
      fd.set("style_lock", styleEl.value);
      fd.set("ref_paths", refPaths.join("\n"));
      const res = await fetch("/api/generate", { method: "POST", body: fd });
      const data = await res.json();
      if (!data.ok) { statusEl.textContent = data.error || "failed"; return; }
      if (data.summary) {
        estimateEl.classList.remove("empty");
        estBig.textContent = "Queued — " + data.summary;
        estSub.textContent = "Range " + data.gen_eta_lo + " – " + data.gen_eta_hi;
        estMeta.textContent = data.preset_label || "";
      }
      scriptEl.value = "";
      await refresh();
    });

    setInterval(refresh, 800);
    refresh();
  </script>
</body>
</html>
